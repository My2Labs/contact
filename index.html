<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#193f36"><title>Contact card</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f5f7f3;color:#1d3a31;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.card{width:100%;max-width:420px;background:white;border:1px solid #dfe8df;border-radius:22px;box-shadow:0 15px 55px #27412a12;padding:32px;text-align:center}.mark{margin:auto auto 18px;display:grid;place-items:center;width:74px;height:74px;border-radius:50%;background:#e6f2e9;font-size:32px}h1{font-size:29px;letter-spacing:-1px;margin:0 0 12px}p{color:#667f70;line-height:1.5}.small{font-size:13px}button{width:100%;background:#1f5945;color:#fff;border:0;border-radius:13px;padding:16px;font-size:16px;font-weight:700;margin-top:16px;cursor:pointer}button:disabled{opacity:.5}#status{color:#91602a}footer{margin-top:26px;color:#889a8d;font-size:12px}</style></head>
<body><main class="card"><div class="mark">✉</div><h1>Contact card</h1><p>Tap below to save this contact to your phone.</p><button id="save" disabled>Preparing contact…</button><p class="small" id="status" role="status"></p><footer>No account · No tracking · Encrypted at rest</footer></main>
<script>
const status = document.getElementById('status');
const button = document.getElementById('save');
function decode64url(x) { const b = atob(x.replace(/-/g,'+').replace(/_/g,'/') + '='.repeat((4-x.length%4)%4)); return Uint8Array.from(b, c=>c.charCodeAt(0)); }
async function getCard() {
  // URL fragment is NOT sent in an HTTP request. It is still readable by anyone with the URL.
  const secret = new URLSearchParams(location.hash.slice(1)).get('key');
  if (!secret) throw new Error('This contact link is missing its access key.');
  const response = await fetch('./contact.enc.json', { cache: 'no-store' });
  if (!response.ok) throw new Error('Contact file could not be loaded.');
  const encrypted = await response.json();
  if (encrypted.version !== 1) throw new Error('Unsupported contact format.');
  const key = await crypto.subtle.importKey('raw', decode64url(secret), 'AES-GCM', false, ['decrypt']);
  const plaintext = await crypto.subtle.decrypt({name:'AES-GCM',iv:decode64url(encrypted.iv)}, key, decode64url(encrypted.data));
  return new Blob([plaintext], {type:'text/vcard;charset=utf-8'});
}
let contactBlob;
getCard().then(blob => {contactBlob=blob;button.disabled=false;button.textContent='Save to Contacts';status.textContent='Ready to share';}).catch(() => {button.textContent='Link unavailable';status.textContent='This contact link is missing or invalid. Ask for a new QR code.';});
button.addEventListener('click',()=>{
  if(!contactBlob)return;
  const url=URL.createObjectURL(contactBlob);
  const a=document.createElement('a');a.href=url;a.download='contact.vcf';a.style.display='none';document.body.appendChild(a);a.click();a.remove();
  status.textContent='If prompted, open the downloaded contact file and choose Add Contact.';
  setTimeout(()=>URL.revokeObjectURL(url),60000);
});
</script></body></html>
